<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeChat HTML Restore Example</title>
  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: #2a2a34;
    }
    .page {
      width: 900px;
      margin: 0 auto;
      padding: 36px 28px;
      box-sizing: border-box;
    }
    .heading {
      margin: 0 0 22px 0;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }
    .caption {
      margin: 0 0 26px 0;
      color: #687084;
      font-size: 14px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }
    .panel {
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 14px 34px rgba(42, 42, 52, 0.08);
    }
    .panel h2 {
      margin: 0 0 14px 0;
      font-size: 14px;
      color: #2763e9;
      letter-spacing: 0;
    }
    .article {
      border: 1px solid #eef1f5;
      padding: 18px;
      min-height: 260px;
      box-sizing: border-box;
    }
    .bad-cell {
      border: 1px solid #c9cbd3;
    }
    .seo {
      margin: 0 0 12px 0;
      color: #2763e9;
      font-size: 10px;
      line-height: 1.6;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="heading">WeChat HTML Restore</h1>
    <p class="caption">Clean editor-export HTML while preserving the visible article template.</p>
    <section class="grid">
      <section class="panel">
        <h2>Before: fragile editor markup</h2>
        <div class="article" style="text-align:justify;">
          <p style="margin:0 0 12px 0;text-align:center;letter-spacing:2px;">示例文章标题</p>
          <table style="width:100%;border-collapse:collapse;margin:0 0 12px 0;">
            <tr>
              <td class="bad-cell" style="color:#2763e9;font-size:12px;letter-spacing:2px;">1 · Market</td>
              <td class="bad-cell" style="border-bottom:1px solid #d7e2ff;"> </td>
            </tr>
          </table>
          <h2 style="margin:0 0 16px 0;text-align:justify;letter-spacing:2px;font-size:22px;">1 市场仍在等方向</h2>
          <p style="margin:0 0 16px 0;line-height:1.9;text-indent:2em;">指数看起来很热闹，但真正要看的还是资金有没有继续留在主线里。</p>
        </div>
      </section>
      <section class="panel">
        <h2>After: draft-add-friendly shape</h2>
        <div class="article" style="text-align:left;">
          <p class="seo">美股 · 期权 · 资讯 · 观点</p>
          <section style="margin:0 0 12px 0;padding:0;text-align:left;line-height:1.2;border:0;">
            <span style="display:inline-block;vertical-align:middle;color:#2763e9;font-size:12px;font-weight:850;letter-spacing:0.12em;line-height:1.2;text-transform:uppercase;border:0;">1 · Market</span>
            <span style="display:inline-block;vertical-align:middle;width:56%;height:1px;margin:0 0 3px 10px;background:#d7e2ff;line-height:1px;font-size:0;border:0;"> </span>
          </section>
          <p style="margin:0 0 16px 0;color:#2a2a34;font-size:22px;line-height:1.45;font-weight:850;text-align:left;letter-spacing:0;">市场仍在等方向</p>
          <p style="margin:0 0 16px 0;color:#454550;font-size:16px;line-height:1.9;text-align:left;text-indent:0;">指数看起来很热闹，但真正要看的还是资金有没有继续留在主线里。</p>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
